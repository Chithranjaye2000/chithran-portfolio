<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#215be2" />
    <script id="theme-init">
      // Run before styles and React so a saved dark theme is present on the first paint.
      ;(() => {
        let theme = 'light'
        try {
          if (localStorage.getItem('portfolio-theme') === 'dark') theme = 'dark'
        } catch {
          // The default remains usable when browser storage is unavailable.
        }
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'dark' ? '#0b1220' : '#215be2')
      })()
    </script>
    <meta
      name="description"
      content="Meet Chithran Jayathunga: quality assurance intern, software developer, and technical content creator based in Ratnapura, Sri Lanka. Explore projects, research, and experience."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Chithran Jayathunga | Quality, Code & Clarity" />
    <meta
      property="og:description"
      content="Software quality assurance, thoughtful development, and clear technical storytelling. Explore Chithran's selected work and research."
    />
    <meta name="twitter:card" content="summary" />
    <title>Chithran Jayathunga | QA, Development & Technical Content</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
