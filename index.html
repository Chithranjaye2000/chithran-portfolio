<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <script id="theme-init">
      // Restore a saved choice, or Dark by default, before styles and React paint.
      ;(() => {
        let theme = 'dark'
        try {
          const saved = localStorage.getItem('portfolio-theme')
          if (saved === 'light' || saved === 'dark') theme = saved
        } catch {
          // The default remains usable when browser storage is unavailable.
        }
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'dark' ? '#0b1220' : '#215be2')
      })()
    </script>
    <meta
      name="description"
      content="Chithran Jayathunga’s portfolio: software QA, academic development projects, and technical videos. Completed QA internship at SLT; based in Maharagama, Sri Lanka."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Chithran Jayathunga | QA, Development & Technical Content" />
    <meta
      property="og:description"
      content="Software testing, web and mobile projects, and technical videos by Chithran Jayathunga, based in Maharagama, Sri Lanka."
    />
    <meta name="twitter:card" content="summary" />
    <title>Chithran Jayathunga | QA, Development & Technical Content</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
